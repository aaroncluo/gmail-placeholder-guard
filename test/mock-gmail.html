<!doctype html>
<!--
  Simulated Gmail compose UI for automated tests.

  The compose markup below is a skeleton captured from the real Gmail web UI
  on 2026-10-15 (tags, nesting, classes, roles, aria-labels, data-tooltips;
  ids, styles and jsaction attributes stripped). The details that broke the
  first version of this extension are all present:

    - TWO elements carry aria-label="Message Body": a hidden, empty
      <textarea class="Ak aiL"> (plain-text fallback) that comes FIRST in
      document order, and the contenteditable <div class="Am Al editable">
      the user types in. Reading the first match reads an empty body.
    - The Send button is NOT inside the <form>; only the recipients and
      subject are. There is no single wrapper that is "the compose" other
      than the dialog / table cell.
    - The Send button is a <div role=button data-tooltip="Send ‪(Ctrl-Enter)‬">
      with a sibling "More send options" ▾ button.

  Gmail attaches its handlers by delegation on the document (jsaction) and
  sends on `click` and on `keydown` (Ctrl/Cmd+Enter); the fake handlers below
  do the same, verified against real Gmail by observing the event sequence.
-->

  .editable { min-height: 60px; border: 1px solid #eee; padding: 6px; }
  .Ak { display: none; }
  .aoO { display: inline-block; background: #0b57d0; color: #fff; padding: 6px 14px; border-radius: 16px; cursor: pointer; }
  .hG { display: inline-block; background: #0b57d0; color: #fff; padding: 6px 8px; cursor: pointer; }
  .hG::before { content: "▾"; }
  input { width: 100%; margin: 4px 0; }
  #log { font-family: monospace; white-space: pre; }
</style>
</head>

<div>Unrelated page button: <span role="button" id="other-button" tabindex="0">Send feedback about Mock</span></div>
<div id="log"></div>

<script>
  // "Gmail" — records sends and closes the compose. Delegated like jsaction.
  window.__sent = [];
  window.__events = [];
  function composeOf(el) { return el.closest('.nH[role=dialog], .inline-reply'); }
  function doSend(compose, via) {
    if (!compose) return;
    var subject = compose.querySelector('input[name=subjectbox]');
    window.__sent.push({
      id: compose.id,
      via: via,
      subject: subject ? subject.value : null,
      body: compose.querySelector('div[aria-label="Message Body"][contenteditable]').innerText
    });
    compose.remove();
    document.getElementById('log').textContent = JSON.stringify(window.__sent, null, 1);
  }
  document.addEventListener('click', function (e) {
    window.__events.push('click:' + (e.target.id || e.target.className || e.target.tagName));
    var btn = e.target.closest('[role=button]');
    if (!btn) return;
    if (btn.classList.contains('aoO')) doSend(composeOf(btn), 'click');
    if (btn.classList.contains('hG')) btn.setAttribute('data-opened', '1');
  });
  document.addEventListener('keydown', function (e) {
    window.__events.push('keydown:' + e.key);
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      doSend(composeOf(e.target), 'shortcut');
      return;
    }
    var btn = e.target.closest && e.target.closest('[role=button].aoO');
    if (btn && (e.key === 'Enter' || e.key === ' ')) doSend(composeOf(btn), 'key');
  });
  document.addEventListener('mousedown', function (e) {
    window.__events.push('mousedown:' + (e.target.id || e.target.className || e.target.tagName));
  });
</script>
